[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrrr-ingest"
version = "0.1.0"
description = "Ingest NOAA HRRR forecasts for a set of points into DuckDB"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "eccodes>=2.37",   # Python bindings; pip wheels bundle the ecCodes C library
    "numpy>=1.24",
    "requests>=2.31",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hrrr-ingest = "hrrr_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
